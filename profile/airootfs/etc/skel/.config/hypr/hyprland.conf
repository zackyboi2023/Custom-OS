# MyDistro default Hyprland config.
# This ships to every new user's home dir (via /etc/skel). Edit this file
# directly to change your default look/behaviour system-wide.
# Full option reference: https://wiki.hyprland.org/Configuring/

monitor=,preferred,auto,1

# --- Autostart ---
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- Look and feel ---
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(1793d0ff)   # matches os-release ANSI_COLOR
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
}

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# --- Key bindings ---
$mod = SUPER

bind = $mod, RETURN, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, kitty -e ranger      # swap for your file manager of choice
bind = $mod, R, exec, wofi --show drun     # app launcher
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
